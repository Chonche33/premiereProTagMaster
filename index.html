<!DOCTYPE html>
<html>
  <head>
    <script src="main.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h4 id="plugin-heading">Tag Master Plugin</h4>
    <div class="main-div">
      <div id="plugin-body"> </div>
    </div>
    <div class="tag-master-controls">
      <div class="control-group">
        <h5>Create New Metadata Column</h5>
        <div class="input-row">
          <input type="text" id="new-tag-input" placeholder="Enter new tag name" />
          <button id="create-tag-btn">Create Column</button>
        </div>
      </div>
      <div class="control-group">
        <h5>Apply Tag to Selected Clips</h5>
        <div class="input-row">
          <input type="text" id="my-tag-input" placeholder="Enter tag value" />
          <button id="apply-tag-btn">Apply to Clips</button>
        </div>
      </div>
    </div>
    <footer>
      <button id="btnPopulate">Populate Application Info</button>
      <button id="btnAddMetadata">Add Tag Master Metadata</button>
      <button id="clear-btn">Clear</button>
    </footer>
  </body>
</html>
